<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="orbita-build" content="202610131748"><meta name="orbita-shell" content="1"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><script src="config.js"></script><meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"></head><body><title>Orbita</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbita">
<style>
/* Layout: iPadOS split view — translucent sidebar + grouped-content canvas; phone collapses to a tab bar. */
:root{
  --bg:#F2F2F7; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F2F7; --surface-3:#E5E5EA;
  --label:#000000; --label-2:rgba(60,60,67,.62); --label-3:rgba(60,60,67,.34); --label-4:rgba(60,60,67,.18);
  --sep:rgba(60,60,67,.16); --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.20);
  --material:rgba(246,246,250,.72); --material-strong:rgba(255,255,255,.86); --scrim:rgba(0,0,0,.28);
  --accent-l:#007AFF; --accent-d:#0A84FF; --accent:var(--accent-l); --on-accent:#FFFFFF;
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30; --purple:#AF52DE; --pink:#FF2D55; --teal:#30B0C7; --indigo:#5856D6; --yellow:#FFCC00; --gray:#8E8E93;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05),0 1px 1px rgba(0,0,0,.03);
  --shadow-md:0 8px 24px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
  --shadow-lg:0 24px 60px rgba(0,0,0,.18),0 6px 18px rgba(0,0,0,.08);
  --board-bg:#FFFFFF; --board-line:rgba(60,60,67,.12); --sheet:#F2F2F7; --cell:#FFFFFF;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px;
  --sidebar:272px;
  --spring:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --bg-2:#1C1C1E; --surface:#1C1C1E; --surface-2:#2C2C2E; --surface-3:#3A3A3C;
  --label:#FFFFFF; --label-2:rgba(235,235,245,.62); --label-3:rgba(235,235,245,.32); --label-4:rgba(235,235,245,.16);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
  --material:rgba(28,28,30,.72); --material-strong:rgba(36,36,38,.86); --scrim:rgba(0,0,0,.5);
  --accent:var(--accent-d);
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --purple:#BF5AF2; --pink:#FF375F; --teal:#40C8E0; --indigo:#5E5CE6; --yellow:#FFD60A; --gray:#98989D;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.45); --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  --board-bg:#1C1C1E; --board-line:rgba(235,235,245,.08); --sheet:#1C1C1E; --cell:#2C2C2E;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --bg-2:#1C1C1E; --surface:#1C1C1E; --surface-2:#2C2C2E; --surface-3:#3A3A3C;
  --label:#FFFFFF; --label-2:rgba(235,235,245,.62); --label-3:rgba(235,235,245,.32); --label-4:rgba(235,235,245,.16);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
  --material:rgba(28,28,30,.72); --material-strong:rgba(36,36,38,.86); --scrim:rgba(0,0,0,.5);
  --accent:var(--accent-d);
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --purple:#BF5AF2; --pink:#FF375F; --teal:#40C8E0; --indigo:#5E5CE6; --yellow:#FFD60A; --gray:#98989D;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.45); --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  --board-bg:#1C1C1E; --board-line:rgba(235,235,245,.08); --sheet:#1C1C1E; --cell:#2C2C2E;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--label);font:15px/1.4 var(--f-ui);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
svg{display:block}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:16px;height:16px}.ico.lg{width:24px;height:24px}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-round);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--label-2)}.faint{color:var(--label-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);height:100%}
.sidebar{position:relative;display:flex;flex-direction:column;gap:2px;padding:14px 12px 12px;background:var(--material);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-right:.5px solid var(--sep);overflow-y:auto;z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));display:grid;place-items:center;color:#fff;box-shadow:inset 0 .5px 0 rgba(255,255,255,.4),var(--shadow-sm)}
.brand-name{font-weight:700;font-size:19px;letter-spacing:-.03em}
.brand-sub{font-size:12px;color:var(--label-2);margin-top:-2px}
.search-btn{display:flex;align-items:center;gap:8px;margin:0 2px 10px;padding:8px 10px;border-radius:10px;background:var(--fill);color:var(--label-2);font-size:15px}
.search-btn kbd{margin-left:auto;font:12px var(--f-ui);color:var(--label-3)}
.nav-group{font-size:13px;font-weight:600;color:var(--label-2);padding:14px 10px 4px;letter-spacing:0}
.nav-item{display:flex;align-items:center;gap:11px;padding:6px 10px;border-radius:10px;font-size:15px;color:var(--label);transition:background .15s}
.nav-item .ico{color:var(--accent)}
.nav-item:hover{background:var(--fill)}
.nav-item:active{background:var(--fill-2)}
.nav-item[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.nav-item[aria-current="page"] .ico{color:var(--on-accent)}
.nav-item .count{margin-left:auto;font-size:13px;color:var(--label-2);font-variant-numeric:tabular-nums}
.nav-item[aria-current="page"] .count{color:rgba(255,255,255,.85)}
.side-foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:8px}
.lvl-chip{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm);text-align:left;width:100%}
.lvl-badge{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-round);color:#fff;background:conic-gradient(var(--accent) var(--p,0%),var(--fill-2) 0);position:relative}
.lvl-badge::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.lvl-badge span{position:relative;z-index:1}
.lvl-meta{min-width:0;flex:1}.lvl-meta b{display:block;font-size:14px}.lvl-meta small{color:var(--label-2);font-size:12px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--label-2);padding:0 8px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--gray)}
.sync.on i{background:var(--green)}.sync.busy i{background:var(--orange)}

.main{position:relative;min-width:0;height:100%;overflow:hidden;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;padding:10px 28px;min-height:56px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
.topbar.scrolled{box-shadow:0 .5px 0 var(--sep)}
.topbar h1{font-size:17px;font-weight:600;margin:0;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
.topbar.scrolled h1{opacity:1;transform:none}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.scroller{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.view{max-width:1180px;margin:0 auto;padding:4px 28px 120px;animation:viewIn .32s var(--spring)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.large-title{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin:6px 0 4px;text-wrap:balance}
.subtitle{color:var(--label-2);font-size:15px;margin:0 0 22px}
.tabbar{display:none}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;font-size:15px;font-weight:600;background:var(--fill);color:var(--accent);transition:transform .12s,background .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.plain{background:none;padding:0 8px}
.btn.danger{color:var(--red)}
.btn.sm{height:30px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--fill);transition:transform .12s,background .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.ghost{background:none}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;position:relative}
.seg button{position:relative;z-index:1;padding:5px 14px;font-size:13px;font-weight:500;border-radius:7px;color:var(--label);transition:color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:600}

/* ---------- Cards & lists ---------- */
.grid{display:grid;gap:16px}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.dash{grid-template-columns:repeat(12,minmax(0,1fr))}
.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm);min-width:0}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-h h2,.card-h h3{font-size:17px;font-weight:600;margin:0;letter-spacing:-.02em}
.card-h .more{margin-left:auto;white-space:nowrap;font-size:15px;color:var(--accent);display:flex;align-items:center;gap:2px}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--label-2)}
.section-h{font-size:13px;font-weight:400;text-transform:uppercase;color:var(--label-2);letter-spacing:.02em;margin:26px 16px 7px}
.list{background:var(--surface);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-sm)}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px;position:relative;width:100%;text-align:left;background:var(--surface)}
.row+.row::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--sep)}
.row.no-ico+.row.no-ico::before,.list.flat .row+.row::before{left:16px}
button.row:active,.row.tap:active{background:var(--fill)}
.row .grow{flex:1;min-width:0}
.row .t{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--label-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--label-3)}
.tile-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.tile-ico .ico{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--fill);color:var(--label-2);white-space:nowrap}
.pill.c{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:34px 20px;color:var(--label-2)}
.empty .ico{width:40px;height:40px;stroke-width:1.4;color:var(--label-3)}
.empty b{color:var(--label);font-size:17px}
.empty p{margin:0;max-width:36ch;font-size:14px}

/* ---------- Check ---------- */
.check{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--label-3);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s,transform .2s var(--spring)}
.check svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s .05s}
.check.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.check.on svg{stroke-dashoffset:0}
.check:active{transform:scale(.85)}
.task-done .t{color:var(--label-3);text-decoration:line-through}
.prio{color:var(--orange);font-weight:700;font-size:14px;letter-spacing:-1px}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;color:var(--label-2);padding-left:4px}
.input,select.input,textarea.input{width:100%;height:44px;padding:0 14px;border-radius:12px;border:0;background:var(--fill);outline:none;font-size:16px;transition:box-shadow .15s}
textarea.input{height:auto;min-height:88px;padding:12px 14px;resize:vertical;line-height:1.45}
.input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.toggle{position:relative;width:51px;height:31px;border-radius:999px;background:var(--fill-2);transition:background .25s;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .3s var(--spring)}
.toggle[aria-pressed="true"]{background:var(--green)}
.toggle[aria-pressed="true"]::after{transform:translateX(20px)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .2s var(--spring)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.swatch:active{transform:scale(.88)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--c,var(--accent));color:#fff}
.chip[aria-pressed="true"] .dot{background:#fff}

/* ---------- Sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px}
.sheet-scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s}
.sheet-wrap.open .sheet-scrim{opacity:1}
.sheet{position:relative;width:min(560px,100%);max-height:min(86vh,820px);display:flex;flex-direction:column;background:var(--sheet);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);overflow:hidden;will-change:transform}

.sheet .list,.sheet .row{background:var(--cell)}
.sheet.wide{width:min(860px,100%)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;position:relative}
.sheet-h h2{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;margin:0;pointer-events:none;padding:0 110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-h .end{margin-left:auto}
.sheet-b{padding:6px 20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.grabber{display:none;width:36px;height:5px;border-radius:3px;background:var(--label-4);margin:7px auto 0}

/* ---------- Island (toasts, live timer) ---------- */
.island{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:80;min-width:126px;height:37px;border-radius:999px;background:#000;color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px 0 8px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:width .45s var(--spring),height .45s var(--spring),border-radius .45s var(--spring),opacity .3s,transform .45s var(--spring);opacity:0;pointer-events:none;overflow:hidden;white-space:nowrap}
.island.show{opacity:1;pointer-events:auto}
.island.big{height:64px;border-radius:32px;padding:0 18px 0 12px}
.island .i-ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c,var(--accent));flex:none}
.island .i-ico .ico{width:17px;height:17px;color:#fff}
.island .i-t{font-size:14px;font-weight:600}
.island .i-s{font-size:12px;color:rgba(255,255,255,.65)}
.island .i-end{margin-left:auto;font:600 14px var(--f-round);font-variant-numeric:tabular-nums;color:var(--c,var(--accent))}
.island button{color:#fff}

/* ---------- Today ---------- */
.hero{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 22px}
.hero .date{font-size:13px;font-weight:600;color:var(--red);text-transform:uppercase;letter-spacing:.04em}
.hero h1{font-size:40px;font-weight:700;letter-spacing:-.04em;margin:2px 0 0;line-height:1.05}
.hero .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.quick{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:6px 6px 6px 14px;box-shadow:var(--shadow-sm);margin-bottom:18px}
.quick input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;height:40px}
.quick .ico{color:var(--accent)}
.parse-hint{display:flex;gap:6px;flex-wrap:wrap;margin:-10px 0 16px 4px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font:700 34px/1.05 var(--f-round);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .v small{font-size:17px;font-weight:600;color:var(--label-2)}
.stat .k{font-size:13px;color:var(--label-2)}
.timeline{position:relative;display:flex;flex-direction:column;gap:2px}
.tl-item{display:grid;grid-template-columns:56px 4px 1fr;gap:12px;align-items:stretch;padding:8px 0;text-align:left;width:100%;border-radius:10px}
.tl-item:active{background:var(--fill)}
.tl-time{font-size:13px;color:var(--label-2);text-align:right;padding-top:1px;font-variant-numeric:tabular-nums}
.tl-bar{border-radius:2px;background:var(--c)}
.tl-item.past{opacity:.5}
.tl-now{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;font-size:12px;font-weight:600;color:var(--red);font-variant-numeric:tabular-nums}
.tl-now i{height:1.5px;background:var(--red);position:relative}
.tl-now i::before{content:"";position:absolute;left:-4px;top:-3.5px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.countdown{display:flex;align-items:center;gap:14px}
.cd-num{font:700 44px/1 var(--f-round);font-variant-numeric:tabular-nums;color:var(--c,var(--accent))}
.quest{display:flex;align-items:center;gap:12px;padding:10px 0}
.quest+.quest{border-top:.5px solid var(--sep)}
.qbar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}
.qbar i{display:block;height:100%;border-radius:3px;background:var(--c,var(--accent));transition:width .6s var(--spring)}

/* ---------- Calendar ---------- */
.cal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.cal-head h2{font-size:28px;font-weight:700;letter-spacing:-.03em;margin:0;min-width:0}
.cal-head h2 span{color:var(--red)}
.cal-head .grow{flex:1}
.month{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.month-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;font-weight:600;color:var(--label-2);text-align:right;padding:8px 0 6px;border-bottom:.5px solid var(--sep)}
.month-dow span{padding-right:10px}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(104px,auto)}
.mday{position:relative;border-right:.5px solid var(--sep);border-bottom:.5px solid var(--sep);padding:6px 4px 4px;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:background .15s}
.mday:nth-child(7n){border-right:0}
.mday:hover{background:color-mix(in srgb,var(--fill) 50%,transparent)}
.mday .n{align-self:flex-end;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.mday.other .n{color:var(--label-3)}
.mday.today .n{background:var(--red);color:#fff;font-weight:700}
.mday.sel{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.mev{display:flex;align-items:center;gap:4px;font-size:11.5px;line-height:1.25;padding:1px 4px;border-radius:5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mev .dot{width:6px;height:6px}
.mev.block{background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--label));font-weight:600}
.mev span{overflow:hidden;text-overflow:ellipsis}
.mev time{color:var(--label-2);margin-left:auto;font-variant-numeric:tabular-nums;padding-left:3px}
.mmore{font-size:11px;color:var(--label-2);padding-left:4px}
.week{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column}
.week-head{display:grid;grid-template-columns:52px repeat(var(--days),minmax(0,1fr));border-bottom:.5px solid var(--sep);position:relative;z-index:2;background:var(--surface)}
.wh{padding:8px 4px 6px;text-align:center;font-size:12px;color:var(--label-2);cursor:pointer}
.wh b{display:block;margin:2px auto 0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:500;color:var(--label);font-variant-numeric:tabular-nums}
.wh.today b{background:var(--red);color:#fff;font-weight:700}
.allday{display:grid;grid-template-columns:52px repeat(var(--days),minmax(0,1fr));border-bottom:.5px solid var(--sep);min-height:0}
.allday>div{padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:.5px solid var(--sep)}
.allday .lab{font-size:11px;color:var(--label-2);padding:6px 6px 0 0;text-align:right;border:0}
.week-body{position:relative;overflow-y:auto;height:min(68vh,760px)}
.week-grid{display:grid;grid-template-columns:52px repeat(var(--days),minmax(0,1fr));position:relative}
.hours{position:relative}
.hours div{height:56px;font-size:11px;color:var(--label-2);text-align:right;padding-right:8px;transform:translateY(-7px);font-variant-numeric:tabular-nums}
.wcol{position:relative;border-left:.5px solid var(--sep);background:repeating-linear-gradient(to bottom,transparent 0,transparent 55.5px,var(--sep) 55.5px,var(--sep) 56px);touch-action:pan-y}
.wcol.today{background-color:color-mix(in srgb,var(--accent) 3%,transparent)}
.wev{position:absolute;left:2px;right:3px;border-radius:7px;padding:4px 6px;font-size:12px;line-height:1.25;overflow:hidden;background:color-mix(in srgb,var(--c) 18%,var(--surface));border-left:3px solid var(--c);color:color-mix(in srgb,var(--c) 60%,var(--label));text-align:left;cursor:grab;touch-action:none;transition:box-shadow .2s,transform .2s var(--spring)}
.wev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wev small{opacity:.8;font-variant-numeric:tabular-nums}
.wev.drag{box-shadow:var(--shadow-lg);transform:scale(1.03);z-index:5;cursor:grabbing;transition:box-shadow .2s}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:3;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.day-side{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}

/* ---------- Exams ---------- */
.gauge{position:relative;width:132px;height:132px;flex:none}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .c b{font:700 30px/1 var(--f-round);font-variant-numeric:tabular-nums}
.gauge .c small{display:block;font-size:12px;color:var(--label-2);margin-top:2px}
.grade{min-width:48px;height:34px;padding:0 8px;border-radius:10px;display:grid;place-items:center;font:700 17px var(--f-round);font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.grade.lode{background:linear-gradient(135deg,#FFD60A,#FF9F0A);color:#3a2500}
.sim{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent;flex:1;min-width:140px}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,50%),var(--fill-2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-12px;box-shadow:0 3px 8px rgba(0,0,0,.15),0 0 0 .5px rgba(0,0,0,.08)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--fill-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.chart{position:relative}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--material-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:10px;padding:6px 10px;font-size:12px;box-shadow:var(--shadow-md);transform:translate(-50%,calc(-100% - 10px));white-space:nowrap;opacity:0;transition:opacity .12s}
.chart .tip b{font:700 14px var(--f-round)}
.ax{font-size:11px;fill:var(--label-2);font-family:var(--f-ui)}
.grid-l{stroke:var(--sep);stroke-width:1}

/* ---------- Notes ---------- */
.notes{display:grid;grid-template-columns:320px minmax(0,1fr);gap:0;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden;height:calc(100vh - 150px);min-height:520px}
.notes-list{border-right:.5px solid var(--sep);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.notes-list .head{padding:12px;display:flex;gap:8px;align-items:center}
.notes-list .items{overflow-y:auto;flex:1;padding:0 8px 12px}
.nitem{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;margin-bottom:2px}
.nitem:hover{background:var(--fill)}
.nitem[aria-current="true"]{background:color-mix(in srgb,var(--yellow) 30%,transparent)}
.nitem b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem small{display:block;font-size:13px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editor{display:flex;flex-direction:column;min-width:0;min-height:0}
.ed-tools{display:flex;gap:4px;padding:8px 12px;border-bottom:.5px solid var(--sep);flex-wrap:wrap;align-items:center}
.ed-tools .icon-btn{width:34px;height:34px;background:none;color:var(--label-2)}
.ed-tools .icon-btn:hover{background:var(--fill);color:var(--label)}
.ed-tools .sep{width:.5px;height:22px;background:var(--sep);margin:0 4px}
.ed-scroll{overflow-y:auto;flex:1;padding:22px 34px 60px}
.ed-meta{font-size:12px;color:var(--label-3);text-align:center;margin-bottom:12px}
.ed-title{width:100%;border:0;background:none;outline:none;font-size:28px;font-weight:700;letter-spacing:-.03em;margin-bottom:8px}
.ed-body{outline:none;font-size:17px;line-height:1.55;min-height:300px;max-width:72ch}
.ed-body:empty::before{content:attr(data-ph);color:var(--label-3)}
.ed-body h2{font-size:22px;letter-spacing:-.02em;margin:18px 0 6px}
.ed-body h3{font-size:18px;margin:14px 0 4px}
.ed-body ul,.ed-body ol{padding-left:24px}
.ed-body ul.cl{list-style:none;padding-left:4px}
.ed-body ul.cl li{position:relative;padding-left:30px;margin:4px 0}
.ed-body ul.cl li::before{content:"";position:absolute;left:0;top:3px;width:20px;height:20px;border-radius:50%;border:1.6px solid var(--label-3);cursor:pointer}
.ed-body ul.cl li.on{color:var(--label-3);text-decoration:line-through}
.ed-body ul.cl li.on::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
.ed-body blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--accent);color:var(--label-2)}
.ed-body code{font-family:var(--f-mono);font-size:.9em;background:var(--fill);padding:1px 5px;border-radius:5px}
.ed-body .ai-sum{background:color-mix(in srgb,var(--purple) 9%,transparent);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.flash{perspective:1200px;width:100%;max-width:560px;margin:0 auto;aspect-ratio:16/10;cursor:pointer}
.flash-in{position:relative;width:100%;height:100%;transition:transform .6s var(--spring);transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.flash-f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-md);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;font-size:20px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.flash-f.back{transform:rotateY(180deg);font-weight:400;font-size:17px;background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.flash-f small{position:absolute;top:14px;font-size:12px;font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.06em}

/* ---------- Board ---------- */
.board-wrap{position:relative;height:calc(100vh - 150px);min-height:480px;border-radius:var(--r-lg);overflow:hidden;background:var(--board-bg);box-shadow:var(--shadow-sm);touch-action:none}
.board-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.palette{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:20px;background:var(--material-strong);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--shadow-lg);z-index:3;max-width:calc(100% - 24px);overflow-x:auto}
.tool{width:42px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--label-2);transition:transform .25s var(--spring),background .15s,color .15s;flex:none}
.tool[aria-pressed="true"]{color:var(--label);background:var(--fill);transform:translateY(-4px)}
.tool .ico{width:24px;height:24px}
.pcolor{width:26px;height:26px;border-radius:50%;background:var(--c);flex:none;margin:0 3px;transition:transform .2s var(--spring);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.pcolor[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.pdiv{width:.5px;height:28px;background:var(--sep);margin:0 4px;flex:none}
.board-top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:3;pointer-events:none}
.board-top>*{pointer-events:auto}
.board-top .glass{background:var(--material-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow-md);border-radius:999px;display:flex;align-items:center;gap:2px;padding:3px}
.board-top .glass .icon-btn{background:none;width:34px;height:34px}
.board-title{border:0;background:none;outline:none;font-weight:600;font-size:15px;padding:0 10px;width:min(220px,40vw)}
.zoom{font-size:12px;color:var(--label-2);padding:0 8px;font-variant-numeric:tabular-nums}
.boards-strip{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px}
.bthumb{flex:none;width:168px;text-align:left}
.bthumb .pv{height:104px;border-radius:12px;background:var(--board-bg);box-shadow:var(--shadow-sm);overflow:hidden;border:2px solid transparent;transition:border-color .15s}
.bthumb[aria-current="true"] .pv{border-color:var(--accent)}
.bthumb .pv canvas{width:100%;height:100%}
.bthumb b{display:block;font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bthumb small{font-size:12px;color:var(--label-2)}

/* ---------- Goals / game ---------- */
.lvl-hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 92%,#000),color-mix(in srgb,var(--accent) 55%,var(--purple)));color:#fff;border-radius:var(--r-xl);padding:24px;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
.lvl-hero::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.lvl-ring{width:112px;height:112px;position:relative;flex:none}
.lvl-ring svg{transform:rotate(-90deg)}
.lvl-ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.lvl-ring .c b{font:800 40px/1 var(--f-round)}
.lvl-ring .c small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.lvl-hero h2{font-size:28px;margin:0;letter-spacing:-.03em}
.lvl-hero p{margin:4px 0 0;opacity:.85}
.xp-bar{height:10px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:14px;width:min(420px,100%)}
.xp-bar i{display:block;height:100%;background:#fff;border-radius:5px;transition:width .8s var(--spring)}
.hstats{display:flex;gap:26px;margin-top:14px;flex-wrap:wrap}
.hstats div b{display:block;font:700 22px var(--f-round);font-variant-numeric:tabular-nums}
.hstats div small{opacity:.8;font-size:12px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 8px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-sm)}
.badge .medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 12px color-mix(in srgb,var(--c) 40%,transparent)}
.badge .medal .ico{width:26px;height:26px}
.badge.locked .medal{background:var(--fill-2);box-shadow:none;color:var(--label-3)}
.badge b{font-size:13px}.badge small{font-size:11px;color:var(--label-2);line-height:1.3}
.goal{padding:16px}
.goal-steps{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.gstep{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:15px;text-align:left;width:100%}
.gstep.on span{color:var(--label-3);text-decoration:line-through}
.gstep .check{width:22px;height:22px}

/* ---------- Focus ---------- */
.focus-stage{display:flex;flex-direction:column;align-items:center;gap:18px;padding:26px 18px}
.focus-ring{position:relative;width:min(300px,70vw);aspect-ratio:1}
.focus-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.focus-ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.focus-ring .c b{font:300 64px/1 var(--f-round);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.focus-ring .c small{display:block;margin-top:6px;color:var(--label-2);font-size:14px}
.focus-ctrl{display:flex;gap:18px;align-items:center}
.round{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;transition:transform .15s}
.round:active{transform:scale(.94)}
.round.go{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green);box-shadow:0 0 0 3px var(--surface),0 0 0 4.5px color-mix(in srgb,var(--green) 22%,transparent)}
.round.pause{background:color-mix(in srgb,var(--orange) 22%,transparent);color:var(--orange);box-shadow:0 0 0 3px var(--surface),0 0 0 4.5px color-mix(in srgb,var(--orange) 22%,transparent)}
.round.stop{background:var(--fill);color:var(--label)}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pl-card{position:relative;border-radius:16px;padding:14px;min-height:118px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 45%,#000));box-shadow:var(--shadow-sm);text-align:left;transition:transform .2s var(--spring)}
.pl-card:active{transform:scale(.97)}
.pl-card b{font-size:16px;letter-spacing:-.02em}
.pl-card small{opacity:.8;font-size:12px}
.pl-card .play{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;backdrop-filter:blur(10px)}
.pl-card.cur{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.sp-embed{width:100%;border:0;border-radius:14px;height:152px;background:var(--fill)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:currentColor;border-radius:1px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* ---------- Docs ---------- */
.drop{border:2px dashed var(--label-4);border-radius:var(--r-lg);padding:22px;display:flex;align-items:center;gap:14px;transition:border-color .2s,background .2s}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.file{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.file .pv{aspect-ratio:4/3;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm);display:grid;place-items:center;overflow:hidden;position:relative}
.file .pv img{width:100%;height:100%;object-fit:cover}
.file .pv .ext{font:800 13px var(--f-round);letter-spacing:.04em;color:#fff;background:var(--c);padding:6px 10px;border-radius:8px}
.file b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file small{font-size:12px;color:var(--label-2)}

/* ---------- Assistant ---------- */
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:480px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(78%,640px);padding:10px 14px;border-radius:20px;font-size:16px;line-height:1.42;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.msg.tool{align-self:flex-start;width:max-content;max-width:88%;background:none;padding:2px 6px;font-size:13px;color:var(--label-2);display:flex;align-items:center;gap:6px}
.msg.tool .ico{color:var(--green)}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:.5px solid var(--sep);background:var(--surface)}
.composer textarea{flex:1;min-height:40px;max-height:140px;border-radius:20px;border:.5px solid var(--sep);background:var(--bg-2);padding:9px 16px;outline:none;resize:none;font-size:16px;line-height:1.35}
.sugg{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 10px}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--label-3);animation:ty 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.ai-orb{width:64px;height:64px;border-radius:50%;background:conic-gradient(from 0deg,var(--blue),var(--purple),var(--pink),var(--orange),var(--blue));filter:blur(.3px);animation:orb 8s linear infinite;box-shadow:0 8px 30px color-mix(in srgb,var(--purple) 40%,transparent);position:relative}
.ai-orb::after{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),rgba(255,255,255,.08) 60%)}
@keyframes orb{to{transform:rotate(360deg)}}

.welcome-box h1{margin:0;font-size:28px;letter-spacing:-.02em}
.welcome-box p{margin:-6px 0 0}
.welcome-box .sync-card{text-align:left}
.welcome-box .form-grid{grid-template-columns:1fr}
.welcome-box .sync-card>div:first-child{display:none!important}
.welcome-logo{width:72px;height:72px;border-radius:18px;margin:0 auto;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
/* ---------- Scrolling fixes: sheets always scroll to the bottom, real viewport height on phones/iPad ---------- */
.sheet-b{flex:1 1 auto;min-height:0;overscroll-behavior:contain;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.sheet-b>*{flex-shrink:0}
@supports (height:100dvh){.sheet{max-height:min(86dvh,820px)}}
@media (max-width:760px){@supports (height:100dvh){.sheet{max-height:92dvh}}}
.scroller{overscroll-behavior-y:contain}
.am-embed{width:100%;border:0;border-radius:12px;overflow:hidden;background:transparent;display:block;margin-top:4px}
.am-logo{display:inline-block;width:20px;height:20px;border-radius:6px;margin-right:8px;vertical-align:-3px;background:linear-gradient(160deg,#FB5C74,#FA233B);position:relative}
.am-logo::after{content:"♪";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
/* Rubrica */
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:600 15px var(--f-round,inherit);color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c));letter-spacing:.02em}
.av.xl{width:84px;height:84px;font-size:32px;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 35%,transparent)}
.bday-strip{margin-bottom:16px;background:linear-gradient(135deg,color-mix(in srgb,#FF2D55 10%,var(--surface)),var(--surface))}
.bday-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -6px;padding:2px 6px 4px}
.bday-row::-webkit-scrollbar{display:none}
.bday{flex:none;width:92px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:16px;background:var(--surface);text-align:center;transition:transform .2s}
.bday:active{transform:scale(.96)}
.bday .av{width:50px;height:50px;font-size:18px}
.bday b{font-size:14px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bday small{font-size:11.5px;color:var(--label-2);line-height:1.25}
.ct-head{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:4px 0 2px}
.ct-head h2{margin:6px 0 0;font-size:24px;letter-spacing:-.02em}
.ct-acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ct-act{flex:1 1 0;min-width:64px;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:14px;background:var(--fill);color:var(--accent);font-size:12px;font-weight:500;text-decoration:none}
.ct-act .ico{width:22px;height:22px}
.ct-act:active{opacity:.7}
/* Finanze: import, previsione */
.csv-map{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.csv-map label{font-size:14px;color:var(--label-2)}
.csv-prev{font-size:12.5px;overflow:auto;max-height:180px;border-radius:12px;background:var(--fill);padding:8px}
.csv-prev table{border-collapse:collapse;white-space:nowrap}
.csv-prev td,.csv-prev th{padding:3px 8px;text-align:left;border-bottom:.5px solid var(--sep)}
.fc-bar{height:10px;border-radius:6px;background:var(--fill-2);overflow:hidden;position:relative;margin:10px 0 6px}
.fc-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.fc-bar i.p{opacity:.35}
/* Piano di studio */
.sp-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--sep)}
.sp-row:last-child{border-bottom:0}
.sp-row .grow{min-width:0}
.sp-min{font:700 20px var(--f-round,inherit);color:var(--c,var(--accent));text-align:right;line-height:1;flex:none}
.sp-min small{display:block;font-size:11px;font-weight:500;color:var(--label-2);margin-top:3px}
@media print{body.print-mode>*:not(#printArea){display:none!important}}
/* Posticipa */
.snz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.snz{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:14px;background:var(--fill);text-align:left;transition:transform .15s,background .15s}
.snz:hover{background:var(--fill-2)}.snz:active{transform:scale(.97)}
.snz b{font-size:15px;color:var(--accent)}.snz small{font-size:12.5px;color:var(--label-2)}
.late-card{background:linear-gradient(135deg,color-mix(in srgb,var(--orange) 9%,var(--surface)),var(--surface))}
.late-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:15px;padding:6px 0}
.late-row+.late-row{border-top:.5px solid var(--sep);padding-top:12px;margin-top:6px}
.late-acts{display:flex;gap:6px;flex-wrap:wrap}
.ppl-chips{align-items:center}
.ppl-chip{gap:6px;padding-left:4px}
select.chip.ppl-add{appearance:none;-webkit-appearance:none;border:0;font:inherit;font-size:14px;color:var(--accent);background:var(--fill);padding:6px 12px;border-radius:999px;cursor:pointer}
/* Apple Music account */
.amk-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0 2px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,#FA2D48 7%,var(--fill))}
.amk-now{display:flex;gap:10px;align-items:center}.amk-now img{border-radius:8px;flex:none}
.amk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.amk-pl{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:13px;font-weight:500;min-width:0;transition:transform .15s}
.amk-pl:active{transform:scale(.96)}
.amk-pl img,.amk-ph{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;background:var(--fill-2);display:grid;place-items:center;color:#FA2D48}
.amk-pl.on img,.amk-pl.on .amk-ph{outline:3px solid #FA2D48;outline-offset:2px}
.amk-pl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.amk-pl small{font-size:11px;color:var(--label-2);font-weight:400}
.drive-card b{font-size:16px}
/* Salute */
.h-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.h-daynav{margin-left:auto;display:flex;gap:6px;align-items:center}
.h-setup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:34px 20px}
.h-setup-ico{font-size:46px;line-height:1}.h-setup b{font-size:19px}.h-setup p{max-width:44ch;margin:0}
.h-hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.h-ring{position:relative;width:168px;height:168px;flex:none;display:grid;place-items:center}
.h-ring.sm{width:96px;height:96px}
.h-ring svg,.h-steps svg{position:absolute;inset:0}
.hr-in{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.hr-in b{font:700 34px var(--f-round);letter-spacing:-.02em}.hr-in small{font-size:12px;color:var(--label-2);margin-top:3px}
.h-ring.sm .hr-in b{font-size:19px}
.h-hero-r{flex:1;min-width:220px;display:flex;flex-direction:column;gap:12px}
.h-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.h-trio div{display:flex;flex-direction:column}.h-trio span{font-size:12.5px}.h-trio b{font:700 22px var(--f-round)}
.h-mac-t{display:flex;justify-content:space-between;font-size:13.5px}.h-mac-t small{color:var(--label-2);font-weight:500}
.h-mac .qbar{margin-top:5px;height:7px}
.h-move{display:flex;gap:16px;align-items:center}
.h-steps{position:relative;width:92px;height:92px;flex:none;display:grid;place-items:center}
.h-row{display:flex;justify-content:space-between;gap:8px}
.h-water{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:.5px solid var(--sep);font-size:14px}
.h-glasses{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.h-glass{width:16px;height:22px;border-radius:3px 3px 6px 6px;border:1.6px solid color-mix(in srgb,var(--teal) 55%,transparent);transition:background .2s,transform .2s var(--spring)}
.h-glass.on{background:var(--teal);border-color:var(--teal)}.h-glass:active{transform:scale(.85)}
.h-meals{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:16px}
.h-meal .card-h{margin-bottom:8px}
.h-items{display:flex;flex-direction:column}
.h-item{display:flex;gap:10px;align-items:center;padding:8px 2px;text-align:left;border-top:.5px solid var(--sep)}
.h-item:first-child{border-top:0}.h-item .t{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.h-item small{font-size:12px}
.h-empty{width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--label-4);color:var(--label-2);font-size:14px}
.h-empty:hover{border-color:var(--accent);color:var(--accent)}
.h-meas{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.h-m{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:var(--fill)}
.h-m span{font-size:12.5px}.h-m b{font:700 20px var(--f-round)}.h-m b small{font-size:12px;font-weight:500;color:var(--label-2)}.h-m>small{font-size:12px;font-weight:600}
.h-ai{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--purple) 9%,var(--surface)),var(--surface))}
.h-mseg{align-self:flex-start;max-width:100%;overflow-x:auto}
.h-por{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.h-por-sum{text-align:center;font-size:15px}.h-por-sum b{display:block;font:700 40px var(--f-round);color:var(--green)}.h-por-sum span{color:var(--label-2);font-size:13.5px}
.h-chk{opacity:0;color:var(--accent)}.row[aria-pressed="true"] .h-chk{opacity:1}
.h-ex{padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--cell)}
.h-sets{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.h-set{display:flex;gap:4px;align-items:center}.h-set .input{width:64px;height:36px;padding:0 8px;text-align:center}.h-set>span:first-child{font-size:12px;width:12px}
.h-today-r{display:flex;gap:16px;align-items:center}
.h-today-s{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;flex:1}
.h-today-s div{display:flex;flex-direction:column}.h-today-s span{font-size:12.5px}.h-today-s b{font:700 18px var(--f-round)}
@media (max-width:640px){.h-ring{width:140px;height:140px}.hr-in b{font-size:28px}.h-hero{justify-content:center}}
/* Messaggi */
.msg-tabs{margin:0 0 14px}
.wa-host{height:calc(100dvh - 150px);min-height:420px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-sm);overflow:hidden}
.msg-row .msg-txt{white-space:nowrap}
.msg-row.unread .t{font-weight:700}
.msg-row.unread::after{content:"";position:absolute;left:6px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--accent)}
.msg-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}.msg-meta small{font-size:12px;color:var(--label-2)}
.msg-bubble{background:var(--cell);border-radius:18px 18px 18px 6px;padding:12px 14px;font-size:16px;line-height:1.45;box-shadow:var(--shadow-sm);word-wrap:break-word}
/* Spesa, sonno */
.shop-row .t{font-size:16px}
.sl-bars{display:flex;gap:6px;align-items:flex-end;height:70px;flex:1;justify-content:flex-end}
.sl-bar{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;width:16px}
.sl-bar i{display:block;width:12px;border-radius:4px;min-height:3px}.sl-bar small{font-size:10px;color:var(--label-2)}
/* Trasferte */
.trip-legs{display:flex;flex-direction:column;gap:10px}
.trip-leg{display:flex;gap:14px;align-items:center;text-align:left;background:var(--cell);padding:14px}
.trip-leg-ico{font-size:28px;width:44px;height:44px;border-radius:12px;background:var(--fill);display:grid;place-items:center;flex:none}
.trip-leg b{display:block;font-size:16px;margin:2px 0}.trip-leg small{display:block}
.trip-wx{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.trip-wx-d{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:14px;background:var(--cell);text-align:center}
.trip-wx-d small{font-size:12px}.trip-wx-d b{font:700 18px var(--f-round)}
/* Registratore, ore */
.rec-stage{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;text-align:center}
.rec-stage b{font:300 44px var(--f-round);letter-spacing:-.02em}
.rec-dot{width:18px;height:18px;border-radius:50%;background:var(--label-4)}
.rec-dot.on{background:var(--red);animation:recp 1.4s ease-in-out infinite}
@keyframes recp{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 50%,transparent)}50%{box-shadow:0 0 0 9px transparent}}
.rec-tx{min-height:120px;max-height:34vh;overflow-y:auto;padding:14px;border-radius:14px;background:var(--cell);font-size:15px;line-height:1.55}
.hr-timer{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
/* a1 soldi+ */
.rc-hero{display:flex;gap:14px;align-items:center;text-align:left;width:100%;margin-bottom:6px}
.rc-hero b{font-size:17px;letter-spacing:-.02em}
.sp-card{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.sp-card b{display:block;font-size:16px}
.sp-emoji{width:46px;height:46px;border-radius:14px;background:var(--fill);display:grid;place-items:center;font-size:24px;flex:none}
.sp-bal{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.sp-b{flex:none;min-width:86px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 10px;border-radius:16px;background:var(--cell);text-align:center}
.sp-b b{font-size:14px;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-b small{font-weight:600;font-variant-numeric:tabular-nums}
/* a2 revisione + anno */
.rv-steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:4px}
.rv-steps span{flex:1;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11px;color:var(--label-3)}
.rv-steps i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;background:var(--fill);color:var(--label-2)}
.rv-steps span.on{color:var(--label)}.rv-steps span.on i{background:var(--accent);color:#fff}
.rv-steps span.ok i{background:var(--green);color:#fff}
.rv-steps b{font-weight:600;line-height:1.2}
.rv-body{display:flex;flex-direction:column;gap:12px;min-height:260px}
.rv-nav{display:flex;gap:8px;align-items:center;padding-top:10px;border-top:.5px solid var(--sep)}.rv-nav .grow{flex:1}
.rv-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.rv-tile{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:16px;background:var(--cell)}
.rv-tile b{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.rv-tile small{color:var(--label-2);font-size:13px}
.rv-tile small+small{font-weight:600;font-size:12px}
.rv-pr{display:flex;gap:10px;align-items:center}
.rv-pr b{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:14px}
.rv-mood{display:flex;gap:10px;justify-content:center}
.rv-mood button{font-size:34px;width:60px;height:60px;border-radius:18px;background:var(--fill);transition:transform .2s var(--spring),background .2s}
.rv-mood button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,transparent);transform:scale(1.12)}
.rv-d{width:40px;flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.1;color:var(--c)}
.rv-d small{font-size:10px;text-transform:uppercase;font-weight:600}.rv-d b{font-size:17px}
.rv-hero,.rv-nudge{display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.rv-hero b,.rv-nudge b{font-size:17px;letter-spacing:-.02em}
.rv-hero-i{font-size:30px;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--fill);flex:none}
.rv-e{font-size:24px;width:34px;text-align:center}
.rv-bars{display:flex;gap:8px;align-items:flex-end;height:150px;overflow-x:auto}
.rv-bars>div{flex:1;min-width:34px;height:100%;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:3px;position:relative;padding-bottom:30px}
.rv-bars i{width:10px;border-radius:5px 5px 2px 2px;align-self:flex-end}
.rv-bars small{position:absolute;bottom:0;font-size:10px;color:var(--label-3)}
.rv-bars span{position:absolute;bottom:12px;font-size:12px}
.yr-hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.yr-bar{position:relative;height:10px;border-radius:5px;background:var(--fill);overflow:visible}
.yr-bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:linear-gradient(90deg,var(--teal),var(--accent))}
.yr-bar span{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--label);transform:translateX(-2px)}
.yr-months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:10px}
.yr-m{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border-radius:8px}
.yr-m small{font-size:10px;color:var(--label-3);text-transform:uppercase}
.yr-m.cur{background:color-mix(in srgb,var(--accent) 14%,transparent)}.yr-m.cur small{color:var(--accent);font-weight:700}
.yr-m.past small{color:var(--label-2)}
.yr-m i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--c)}.yr-m i.ok{background:var(--c)}
.yg{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.yg-top{display:flex;gap:10px;align-items:flex-start}.yg-top b{display:block;font-size:16px;letter-spacing:-.01em}
.yg-e{font-size:24px;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);flex:none}
.yg-bar{position:relative;height:8px;border-radius:4px;background:var(--fill)}
.yg-bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--c);transition:width .8s var(--spring)}
.yg-bar span{position:absolute;top:-3px;width:2px;height:14px;background:var(--label-3);border-radius:1px}
.yg-bar.sm{height:6px;margin-top:5px}
.yg-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.yg-big{display:flex;gap:16px;align-items:center}
.yg-mini{display:flex;gap:10px;align-items:center}.yg-mini>span{font-size:20px}.yg-mini b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* a3 scanner */
.sc-wrap{position:relative}
.sc-empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:34px 16px;border-radius:18px;background:var(--cell);border:1.5px dashed var(--sep)}
.sc-empty .ico{width:42px;height:42px;color:var(--label-3)}.sc-empty p{margin:0;max-width:380px}
.sc-stage{position:relative;flex:none;border-radius:14px;overflow:hidden;background:#111;display:flex;justify-content:center;align-items:center;padding:8px;touch-action:none}
.sc-box{position:relative;flex:none}
.sc-box canvas,.sc-ov{position:absolute;inset:0;width:100%;height:100%;display:block}
.sc-h{fill:rgba(255,255,255,.25);stroke:var(--accent);cursor:grab;touch-action:none}
.sc-tools{display:flex;flex-direction:column;gap:8px;flex:none}
.sc-strip{display:flex;gap:8px;overflow-x:auto;padding:2px;flex:none}

.sq-tile.done{opacity:.78}.sq-tile.done .sq-t{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--label) 35%,transparent)}
.sq-stamp{font-weight:700;font-size:13px;color:var(--green);border:2px solid var(--green);border-radius:8px;padding:1px 8px;transform:rotate(-6deg);display:inline-block}
.sq-tile.pop{transform:scale(1.04)}.sq-tile.flip{animation:sqFlip .6s cubic-bezier(.2,.8,.2,1)}
@keyframes sqFlip{from{transform:rotateY(90deg);opacity:.2}to{transform:none;opacity:1}}
.sq-myst{align-items:center;justify-content:center;cursor:pointer;border-style:dashed;border-color:color-mix(in srgb,var(--purple) 55%,transparent);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--purple) 8%,var(--surface)) 0 12px,var(--surface) 12px 24px);text-align:center}
.sq-myst .sq-q{font:800 40px var(--f-round,inherit);color:var(--purple);line-height:1;animation:sqBob 2.4s ease-in-out infinite}.sq-myst small{color:var(--label-2)}
.sq-myst.reveal{animation:sqOut .38s ease-in forwards}@keyframes sqOut{to{transform:rotateY(90deg);opacity:.3}}@keyframes sqBob{50%{transform:translateY(-4px) rotate(6deg)}}
.sq-strips{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-top:10px}
.sq-strip{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--cell);border:0;font:inherit;color:inherit;text-align:left;min-width:0}
.sq-strip .t{font-weight:600;font-size:14.5px}.sq-strip .s{font-size:12.5px;color:var(--label-2);margin-top:1px}.sq-se{font-size:24px;flex:none}
.sq-strip.epic{background:linear-gradient(135deg,color-mix(in srgb,#FFB800 18%,var(--cell)),var(--cell))}.sq-strip.epic.done{opacity:.75}
.sq-strip.new{cursor:pointer}.sq-dots{display:flex;gap:4px;margin-top:6px}.sq-dots i{width:18px;height:4px;border-radius:2px;background:var(--fill-2,var(--fill))}.sq-dots i.on{background:var(--orange)}.sq-dots i.cur{background:color-mix(in srgb,var(--orange) 45%,var(--fill))}
.sq-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sq-stats div{background:var(--cell);border-radius:14px;padding:10px;text-align:center}.sq-stats b{display:block;font-size:24px}.sq-stats small{color:var(--label-2);font-size:12px}
.sq-album{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.sq-badge{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:16px;background:var(--cell);text-align:center;filter:grayscale(1);opacity:.6}.sq-badge span{font-size:28px}.sq-badge b{font-size:13.5px}.sq-badge small{font-size:11.5px;color:var(--label-2)}
.sq-badge.lv1,.sq-badge.lv2,.sq-badge.lv3{filter:none;opacity:1}.sq-badge.lv1{box-shadow:inset 0 0 0 2px #CD7F32}.sq-badge.lv2{box-shadow:inset 0 0 0 2px #B8BCC6}.sq-badge.lv3{box-shadow:inset 0 0 0 2px #FFB800;background:color-mix(in srgb,#FFB800 12%,var(--cell))}
.sq-sagas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.sq-sg{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:16px;border:0;background:var(--cell);font:inherit;color:inherit;text-align:left;cursor:pointer}.sq-sg small{color:var(--label-2);font-size:12.5px}
@media (max-width:640px){.sq-meta{display:none}.sq-grid{grid-template-columns:1fr}.sq-tile{min-height:0}.sq-stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.sq-tile,.sq-myst .sq-q,.sq-tile[style*="#FFB800"]{animation:none!important}}
</style>

    <symbol id="i-plane" viewBox="0 0 24 24"><path d="M10.5 13.5L4 11l1.5-1.5 7 1 4-4c.9-.9 2.6-1.3 3.2-.7.6.6.2 2.3-.7 3.2l-4 4 1 7L14.5 21 12 14.5l-3 3v2.5L7.5 21.5 6 18l-3.5-1.5L4 15h2.5z"/></symbol>

<script id="orbita-motion">
(()=>{
const RM=matchMedia('(prefers-reduced-motion: reduce)'), FINE=matchMedia('(hover:hover) and (pointer:fine)');
const q=(s,r=document)=>r.querySelector(s), qa=(s,r=document)=>[...r.querySelectorAll(s)];
const EASE='cubic-bezier(.32,.72,0,1)';
const rubber=(o,d,c=.55)=>(o*d*c)/(d+c*Math.abs(o));

/* 1 · Ambient parallax (springed, idles when settled) */
const amb=q('.ambient'), sc=q('#scroller');
const T={x:0,y:0},C={x:0,y:0},V={x:0,y:0},P={x:0,y:0}; let raf=0;
const kick=()=>{ if(!raf&&!RM.matches) raf=requestAnimationFrame(tick); };
function tick(){ raf=0; let moving=false;
  for(const k of ['x','y']){ V[k]+=(T[k]-C[k])*.06; V[k]*=.8; C[k]+=V[k]; if(Math.abs(T[k]-C[k])>.05||Math.abs(V[k])>.02) moving=true; }
  if(amb) amb.style.transform='translate3d('+C.x.toFixed(2)+'px,'+C.y.toFixed(2)+'px,0)'; if(moving) kick(); }
const aim=()=>{ T.x=P.x; T.y=Math.max(-140,-(sc?sc.scrollTop:0)*.07)+P.y; kick(); };
sc&&sc.addEventListener('scroll',aim,{passive:true});
addEventListener('pointermove',e=>{ if(!FINE.matches) return; P.x=(e.clientX/innerWidth-.5)*-28; P.y=(e.clientY/innerHeight-.5)*-18; aim(); },{passive:true});

/* 2 · Sliding selection indicators (sidebar + tab bar) */
function indicator(box,itemSel,cls){
  if(!box) return {};
  let ind=null,last=null,anim=null,hold=false;
  function rectOf(el){ return {x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight}; }
  function put(r){ ind.style.width=r.w+'px'; ind.style.height=r.h+'px'; ind.style.transform='translate3d('+r.x+'px,'+r.y+'px,0)'; }
  function place(animate){
    if(hold) return;
    const act=q(itemSel+'[aria-current="page"]',box);
    if(!ind||!ind.isConnected){ ind=document.createElement('div'); ind.className=cls; box.prepend(ind); if(last) put(last); }
    box.classList.toggle('has-ind',!!act); ind.classList.toggle('on',!!act); ind.style.opacity=act?'':'0';
    if(!act) return;
    const r=rectOf(act);
    if(!r.w) return;
    const from=last; put(r); last=r;
    if(animate&&from&&!RM.matches&&(from.x!==r.x||from.y!==r.y)){
      anim&&anim.cancel();
      anim=ind.animate([{transform:'translate3d('+from.x+'px,'+from.y+'px,0) scale('+(from.w/r.w)+','+(from.h/r.h)+')',transformOrigin:'0 0'},{transform:'translate3d('+r.x+'px,'+r.y+'px,0)',transformOrigin:'0 0'}],{duration:420,easing:EASE});
    }
  }
  new MutationObserver(recs=>{ if(recs.every(m=>[...m.addedNodes].every(n=>n===ind)&&!m.removedNodes.length)) return; place(true); }).observe(box,{childList:true});
  addEventListener('resize',()=>{ last=null; place(false); });
  place(false);
  return { get ind(){return ind;}, set last(v){last=v;}, set hold(v){hold=v;}, place };
}
indicator(q('#sidebar'),'.nav-item','nav-ind');
const tabs=indicator(q('#tabbar'),'button','tab-ind');

/* 3 · Tab bar scrub: drag across the bar, release to switch */
(function(){
  const tb=q('#tabbar'); if(!tb) return;
  let st=null, eatClick=0;
  tb.addEventListener('pointerdown',e=>{ const ind=tabs.ind; if(!ind) return;
    const m=/translate3d\(([-\d.]+)px/.exec(ind.style.transform);
    st={x0:e.clientX,y0:e.clientY,ix:m?+m[1]:0,drag:false,id:e.pointerId}; });
  tb.addEventListener('pointermove',e=>{ if(!st) return; const dx=e.clientX-st.x0, dy=e.clientY-st.y0;
    if(!st.drag){ if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){ st.drag=true; tb.setPointerCapture(st.id); tabs.hold=true; tabs.ind.getAnimations().forEach(a=>a.cancel()); } else return; }
    const max=tb.clientWidth-tabs.ind.offsetWidth-6; let x=st.ix+dx;
    if(x<6) x=6-rubber(6-x,tb.clientWidth); if(x>max) x=max+rubber(x-max,tb.clientWidth);
    tabs.ind.style.transform='translate3d('+x+'px,6px,0) scale(1.06,1.1)'; st.x=x; });
  const end=()=>{ if(!st) return; const s=st; st=null; if(!s.drag) return; tabs.hold=false; eatClick=performance.now();
    const btns=qa('button',tb), cx=(s.x??s.ix)+tabs.ind.offsetWidth/2;
    let best=btns[0],bd=1e9; for(const b of btns){ const d=Math.abs(b.offsetLeft+b.offsetWidth/2-cx); if(d<bd){bd=d;best=b;} }
    const to={x:best.offsetLeft,y:best.offsetTop,w:best.offsetWidth,h:best.offsetHeight};
    tabs.ind.animate([{transform:tabs.ind.style.transform},{transform:'translate3d('+to.x+'px,'+to.y+'px,0)'}],{duration:380,easing:'cubic-bezier(.34,1.3,.64,1)'});
    tabs.ind.style.transform='translate3d('+to.x+'px,'+to.y+'px,0)'; tabs.last=to;
    navigator.vibrate&&navigator.vibrate(6);
    if(best.getAttribute('aria-current')==='page') return;
    if(best.dataset.go) location.hash='#'+best.dataset.go; else best.click(); };
  tb.addEventListener('pointerup',end); tb.addEventListener('pointercancel',end);
  tb.addEventListener('click',e=>{ if(performance.now()-eatClick<350&&e.isTrusted){ e.stopPropagation(); e.preventDefault(); } },true);
})();

/* 4 · Staggered entrance when the section changes */
const view=q('#view');
new MutationObserver(()=>{ const v=q(':scope>.view.enter',view); if(!v||v.dataset.st) return; v.dataset.st=1;
  const items=[]; for(const c of v.children){ if(c.matches('.grid,.dash')) items.push(...c.children); else items.push(c); }
  items.slice(0,14).forEach((el,i)=>{ el.classList.add('st'); el.style.setProperty('--i',i); });
  setTimeout(()=>items.forEach(el=>el.classList.remove('st')),1400);
}).observe(view,{childList:true});

/* 5 · Segmented control: pill glides to the new choice */
let segMem=null;
document.addEventListener('pointerdown',e=>{ const b=e.target.closest('.seg button'); if(!b){segMem=null;return;}
  const seg=b.parentElement, cur=q('button[aria-pressed="true"]',seg); if(!cur||cur===b){segMem=null;return;}
  const segs=qa('.seg'); segMem={idx:segs.indexOf(seg),bi:[...seg.children].indexOf(b),r:{x:cur.offsetLeft,y:cur.offsetTop,w:cur.offsetWidth,h:cur.offsetHeight}}; },true);
document.addEventListener('click',()=>{ if(!segMem||RM.matches) return; const m=segMem; segMem=null;
  requestAnimationFrame(()=>{ const seg=qa('.seg')[m.idx]; if(!seg) return; const nb=q('button[aria-pressed="true"]',seg); if(!nb) return;
    const g=document.createElement('div'); g.className='seg-ghost'; seg.prepend(g);
    const to={x:nb.offsetLeft,y:nb.offsetTop,w:nb.offsetWidth,h:nb.offsetHeight};
    Object.assign(g.style,{left:to.x+'px',top:to.y+'px',width:to.w+'px',height:to.h+'px'});
    const prevBg=nb.style.background, prevSh=nb.style.boxShadow; nb.style.background='transparent'; nb.style.boxShadow='none';
    const a=g.animate([{transform:'translate('+(m.r.x-to.x)+'px,0) scaleX('+(m.r.w/to.w)+')',transformOrigin:'0 0'},{transform:'none',transformOrigin:'0 0'}],{duration:340,easing:EASE});
    a.onfinish=a.oncancel=()=>{ g.remove(); nb.style.background=prevBg; nb.style.boxShadow=prevSh; };
  }); });

/* 6 · Completion celebration on checks */
let chk=null; const layer=document.createElement('div'); layer.className='fx-layer'; document.body.appendChild(layer);
const keyOf=el=>{ const host=el.closest('[data-act],[data-gstep],[data-tp],[data-hab],[data-id],button')||el; let s=host.tagName.toLowerCase();
  for(const a of host.attributes) if(a.name.startsWith('data-')) s+='['+a.name+'="'+CSS.escape(a.value)+'"]'; return s; };
document.addEventListener('pointerdown',e=>{ const c=e.target.closest('.check,.hcheck')||e.target.closest('.gstep')?.querySelector('.check'); if(!c){chk=null;return;}
  chk={key:keyOf(c),was:c.classList.contains('on'),el:c}; },true);
document.addEventListener('click',()=>{ if(!chk) return; const m=chk; chk=null;
  setTimeout(()=>{ let host=m.el.isConnected?m.el:null;
    if(!host){ const h=q(m.key); host=h&&(h.matches('.check,.hcheck')?h:h.querySelector('.check,.hcheck')); }
    if(!host||m.was||!host.classList.contains('on')) return; celebrate(host); },20); });
function celebrate(el){
  navigator.vibrate&&navigator.vibrate(10);
  if(RM.matches) return;
  el.animate([{transform:'scale(.8)'},{transform:'scale(1.18)',offset:.45},{transform:'scale(1)'}],{duration:460,easing:'cubic-bezier(.34,1.56,.64,1)'});
  const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  const col=getComputedStyle(el).backgroundColor||'currentColor';
  const ring=document.createElement('i'); ring.className='fx-ring'; Object.assign(ring.style,{left:cx+'px',top:cy+'px',borderColor:col}); layer.appendChild(ring);
  ring.animate([{transform:'scale(.9)',opacity:.7},{transform:'scale(2.4)',opacity:0}],{duration:520,easing:'cubic-bezier(.23,1,.32,1)'}).onfinish=()=>ring.remove();
  for(let i=0;i<9;i++){ const a=i/9*Math.PI*2+Math.random()*.4, d=20+Math.random()*12, dot=document.createElement('i'); dot.className='fx-dot';
    Object.assign(dot.style,{left:cx+'px',top:cy+'px',background:col}); layer.appendChild(dot);
    dot.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px) scale(.2)',opacity:0}],{duration:520+Math.random()*120,easing:'cubic-bezier(.23,1,.32,1)'}).onfinish=()=>dot.remove(); }
}

/* 7 · Specular highlight follows the pointer on glass cards */
let hovCard=null;
document.addEventListener('pointermove',e=>{ if(!FINE.matches) return; const c=e.target.closest&&e.target.closest('.card'); if(!c) return;
  const r=c.getBoundingClientRect(); c.style.setProperty('--mx',(e.clientX-r.left)+'px'); c.style.setProperty('--my',(e.clientY-r.top)+'px'); },{passive:true});
})();
</script>
</body></html>
